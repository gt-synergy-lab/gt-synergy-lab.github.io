<body>
<div data-site-header data-root=".."></div>

<main class="main site-main synergy-page publication-main minh-100vh">
  <section class="gt-page-hero publication-hero">
    <div class="gt-page-hero__content">
      <p class="gt-eyebrow">Publications</p>
      <h1>Research papers</h1>
      <p>Browse Synergy Lab publications by date and research area, including peer-reviewed work and recent arXiv preprints.</p>
    </div>
  </section>

  <div class="publication-shell">
    <aside class="publication-filters" aria-label="Publication filters">
      <div class="publication-filter-card">
        <div class="publication-filter-heading">
          <p class="gt-eyebrow">Library</p>
          <h2>Browse</h2>
        </div>

        <label class="publication-sidebar-search" for="publication-search-input">
          <i class="fas fa-search" aria-hidden="true"></i>
          <span class="sr-only">Search publications</span>
          <input id="publication-search-input" type="search" placeholder="Title, venue, keyword, or author" autocomplete="off">
        </label>

        <div class="publication-filter-group">
          <h3>Topics</h3>
          <div id="publication-topic-filters" class="publication-topic-filters" role="group" aria-label="Research topics — select multiple to match all"></div>
        </div>

      </div>
    </aside>

    <section class="publication-results" aria-labelledby="publication-results-title">
      <header class="publication-results-header">
        <div>
          <p class="gt-eyebrow">Publication archive</p>
          <h2 id="publication-results-title">All papers</h2>
          <p id="publication-active-topics" class="publication-active-topics" hidden></p>
        </div>
        <p id="publication-count" class="publication-count" aria-live="polite"></p>
      </header>
      <div id="paper-container" class="publication-list">
        <div class="publication-loading" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>
    </section>
  </div>
